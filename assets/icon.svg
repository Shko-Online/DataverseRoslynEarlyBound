<!-- Shko Online's Early Bound: the Shko Online cloud on a crimson tile, holding the braces of a generated class. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Shko Online's Early Bound">
  <title>Shko Online's Early Bound</title>
  <!-- Icon tile: Shko Online crimson, with the logo's rounded-square corner. -->
  <rect width="128" height="128" rx="28" fill="#E40046"/>
  <!-- The cloud of the Shko Online mark, in white. -->
  <path fill="#fff" transform="translate(13.6 12.8) scale(3.15)"
        d="M7.53 27.33a7.53 7.53 0 0 1 -2.56-14.61a7.5 7.5 0 0 1 8.56-4.73a9.33 9.33 0 0 1 16.45 6.67a7.53 7.53 0 0 1 -5.51 12.67z"/>
  <!-- Where the mark has its power symbol, this product has a class body: { ... } -->
  <g fill="none" stroke="#E40046" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 51c-6.5 0-9 3-9 8.500v5.500c0 4.500-2.400 7-7 7c4.600 0 7 2.500 7 7v5.500c0 5.500 2.500 8.500 9 8.500"/>
    <path d="M77 51c6.500 0 9 3 9 8.500v5.500c0 4.500 2.400 7 7 7c-4.600 0-7 2.500-7 7v5.500c0 5.500-2.500 8.500-9 8.500"/>
  </g>
  <g fill="#E40046">
    <circle cx="57.500" cy="72" r="3.400"/>
    <circle cx="66" cy="72" r="3.400"/>
    <circle cx="74.500" cy="72" r="3.400"/>
  </g>
</svg>
