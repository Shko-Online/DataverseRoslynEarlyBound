# Fixture: an activity with party lists, in one file with the table its party lists are made of.
entities:
  - logicalName: activityparty
    schemaName: ActivityParty
    displayName: Activity Party
    description: Person or group associated with an activity. An activity can have multiple activity parties.
    entitySetName: activityparties
    logicalCollectionName: activityparties
    primaryIdAttribute: activitypartyid
    objectTypeCode: 135
    ownershipType: None
    attributes:
      - logicalName: activitypartyid
        schemaName: ActivityPartyId
        type: Uniqueidentifier
        isValidForCreate: false
        isValidForUpdate: false
      - logicalName: addressused
        schemaName: AddressUsed
        type: String
        maxLength: 200
      - logicalName: partyid
        schemaName: PartyId
        type: Lookup
        displayName: Party
        targets: [account, contact]
  - logicalName: email
    schemaName: Email
    displayName: Email
    displayCollectionName: Email Messages
    description: Activity that is delivered using email protocols.
    entitySetName: emails
    logicalCollectionName: emails
    primaryIdAttribute: activityid
    primaryNameAttribute: subject
    objectTypeCode: 4202
    ownershipType: UserOwned
    isActivity: true
    attributes:
      - logicalName: activityid
        schemaName: ActivityId
        type: Uniqueidentifier
        displayName: Email Message
        requiredLevel: SystemRequired
        isValidForUpdate: false
      - logicalName: from
        schemaName: From
        type: PartyList
        displayName: From
      - logicalName: regardingobjectid
        schemaName: RegardingObjectId
        type: Lookup
        displayName: Regarding
        targets: [account, contact]
      - logicalName: subject
        schemaName: Subject
        type: String
        displayName: Subject
        maxLength: 800
      - logicalName: to
        schemaName: To
        type: PartyList
        displayName: To
