# Shko Online's Early Bound
# https://github.com/Shko-Online/DataverseRoslynEarlyBound
#
# 'earlybound pull' reads the "pull" section and downloads metadata into the output folder.
# The ShkoOnline.EarlyBound package reads the "generator" section whenever the project builds.

# The Dataverse environment metadata is pulled from.
environment: https://contoso.crm4.dynamics.com

pull:
  # Tables to pull, by logical name. * matches any run of characters, for example "sho_*".
  entities:
    - account
    - contact
    - email
    - "sho_*"

  solutions: []
  exclude: []
  output: Metadata
  layout: perEntity
  relationships: included

generator:
  namespace: Contoso.Model
  serviceContextName: DataverseContext

  # Only the members this project's code uses are generated (the default).
  # Two other samples read these files. Contoso.Console does not reference this project, so it
  # gets classes of its own with the members it uses. Contoso.Plugins.Tests does, so it uses
  # these classes and generates what its tests need beyond them in AccountTestEntity : Account.
  generateOnlyUsedAttributes: true

  # The publisher prefix, so that sho_duedate becomes Sho_DueDate.
  camelCaseCustomWords: [sho]
